<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaker Design</title>
    <script>
      // Apply saved/system theme before first paint to avoid a flash
      if (
        localStorage.theme === 'dark' ||
        (!('theme' in localStorage) && matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <meta name="description" content="Web-baseret speaker design værktøj - datablad-ekstraktion, kabinetdesign, akustisk simulering" />
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
